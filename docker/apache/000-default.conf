<VirtualHost *:80>
    ServerName localhost

    # Configuración del proxy
    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy balancer://mycluster>
        # Miembros del clúster (los dos contenedores backend)
        BalancerMember http://app1:80
        BalancerMember http://app2:80

        # Método de balanceo (byrequests = Round Robin)
        ProxySet lbmethod=byrequests
    </Proxy>

    # Redirigir todo el tráfico al clúster
    ProxyPass / balancer://mycluster/
    ProxyPassReverse / balancer://mycluster/
    
    # Página de estado del balanceador (opcional)
    <Location /balancer-manager>
        SetHandler balancer-manager
    </Location>
</VirtualHost>
