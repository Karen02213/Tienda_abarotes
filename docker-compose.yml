version: '3.8'

services:
  web:
    build: .
    container_name: tienda-web
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:latest
    container_name: tienda-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: tiendadb
      MARIADB_USER: tiendauser
      MARIADB_PASSWORD: tiendapass
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tienda-pma
    environment:
      PMA_HOST: db
    ports:
      - "8082:80"
    depends_on:
      - db

volumes:
  db_data:
